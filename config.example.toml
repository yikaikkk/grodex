# Grodex Configuration
# Copy to ~/.grodex/config.toml or <project>/.grodex/config.toml

# ── Provider ──────────────────────────────────────────
# Provider name: "openai", "anthropic", or custom
provider = "openai"

# Model name
model = "gpt-5"

# Wire protocol: "responses", "chat", or "messages"
#   responses  → OpenAI Responses API
#   chat       → OpenAI Chat Completions API
#   messages   → Anthropic Messages API
wire_protocol = "responses"

# API endpoint (optional, defaults to provider's standard endpoint)
# endpoint = "https://api.openai.com/v1"

# ── Context Window ────────────────────────────────────
# Model context window size in tokens. If not specified, the system
# auto-detects based on model name (see built-in table below).
# Common models:
#   gpt-5                            → 256K
#   gpt-4, gpt-4-turbo, gpt-4o     → 128K
#   gpt-4.1                          → 1M
#   gpt-3.5-turbo                   → 16K
#   claude-* (all current)           → 200K
#   deepseek-chat, deepseek-coder   → 128K
#   qwen-max, qwen-plus             → 128K
#   qwen-turbo                      → 1M
#   gemini-1.5-pro                  → 2M
# Unknown models default to 1M; set context_window explicitly to override.
# context_window = 1048576

# Compaction threshold: when context usage reaches this percentage of
# context_window, auto-compaction is triggered. Default: 85 (%).
# Lower values trigger compaction earlier (more aggressive pruning).
# compaction_threshold_percent = 85

# ── Tool Result Limits ─────────────────────────────────
# Maximum size (in bytes) for a single tool result before it's saved
# to a temp file and replaced with a reference. Default: 32KB.
# Large tool outputs (e.g. reading big files) are automatically
# offloaded to prevent context bloat.
# max_tool_result_bytes = 32768

# Maximum sampling steps per turn. Long multi-tool tasks need a larger
# budget; when exhausted, the model is forced to emit a progress summary
# instead of stopping silently. Default: 40.
# max_steps_per_turn = 40

# Sub-agent caps for the delegate_task tool. `max_subagents` limits how
# many sub-agents may run concurrently; `max_subagents_per_session` caps
# the session total (defaults to 4x the concurrent cap). Over-cap
# delegations are refused with a message the model can act on.
# max_subagents = 4
# max_subagents_per_session = 16

# ── Instruction Discovery (Design Doc 19 §7.3) ─────────
# Compatibility vendor directories (.grok/.codex/.claude/.cursor) are
# NEVER scanned by default. Opt in per vendor; recognized labels:
# "grok", "codex", "claude", "cursor". When a canonical AGENTS.md /
# .agent/rules also exists at the same level, canonical content keeps
# precedence and each vendor load emits a diagnostic (no silent merge).
# instruction_compat_vendors = ["claude", "cursor"]

# ── Authentication ────────────────────────────────────
# API key can be set here or via environment variable:
#   OPENAI_API_KEY=sk-...
#   ANTHROPIC_API_KEY=sk-ant-...
# Config file takes precedence over env vars.
# api_key = "sk-..."

# ── Tools ─────────────────────────────────────────────
# [rules]
# read_file = "allow"
# write_file = "ask"
# exec = "ask"

# ── Sandbox ───────────────────────────────────────────
# Profile: "workspace", "readonly", "restricted", "full"
# sandbox_profile = "workspace"

# ── Memory ────────────────────────────────────────────
# Enable long-term memory
# [memory]
# enabled = true
# SQLite + FTS5 database path (leading ~ is expanded to the home dir).
# Precedence: GRODEX_MEMORY_DB env > this value > ~/.grodex/memory.db
# path = "~/.grodex/memory.db"

# ── Memory embedding (hybrid FTS5 + vector retrieval) ──
# Disabled by default → pure FTS5 ranking. When enabled, every retrieval
# failure (network, timeout, missing key) silently degrades to FTS5.
#
# [memory.embedding]
# Master switch for the vector path.
# enabled = true
# Any OpenAI-compatible embeddings endpoint:
# endpoint = "https://api.openai.com/v1/embeddings"
# model = "text-embedding-3-small"
# Env var holding the API key (default: GRODEX_OPENAI_API_KEY):
# api_key_env_var = "GRODEX_OPENAI_API_KEY"
# Must match the model output dim; mismatched vectors are rejected:
# expected_dimension = 1536
# Max texts per single embeddings API call:
# batch_size = 64
# Max documents embedded per startup backfill (rest continues next run):
# backfill_max_documents = 200

# ── Model Routes (failover) ───────────────────────────
# Define multiple provider/model candidates with ordered failover.
# When a candidate fails with a failover-eligible error (Transport, 5xx,
# RateLimited), the next candidate is tried. Each candidate has its own
# circuit breaker.
#
# [model_routes.default]
# # How long to stay on a candidate after success:
# #   "turn"    = reset every Turn (default)
# #   "step"    = stay across Steps within a Turn
# #   "session" = stay for the entire Session
# sticky_scope = "turn"
# # Max candidates to try in one failover sequence
# max_candidates = 5
# # Max wall-clock seconds for a single Turn's sampling
# turn_deadline_secs = 120
#
# [[model_routes.default.candidates]]
# candidate_id = "openai-primary"
# provider_id = "openai"
# model_id = "gpt-5"
# wire_protocol = "responses"
# endpoint = "https://api.openai.com/v1"
# priority = 0
# account_id = "default"
# region = "us-east-1"
# revision = "2024-08"
#
# [[model_routes.default.candidates]]
# candidate_id = "anthropic-fallback"
# provider_id = "anthropic"
# model_id = "claude-3-opus"
# wire_protocol = "messages"
# endpoint = "https://api.anthropic.com/v1"
# priority = 1
